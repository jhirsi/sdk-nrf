# Arceli W5500 Ethernet shield on nRF9151 DK (Arduino SPI3: D10–D13, INT D9, RST D8).
# Devicetree: Zephyr shield zephyr/boards/shields/arceli_eth_w5500/arceli_eth_w5500.overlay
# plus w5500.overlay (this sample).
#
#   cd nrf/samples/dect/dect_bridge_routing
#   west build -p -b nrf9151dk/nrf9151/ns . -- \
#     -DSHIELD=arceli_eth_w5500 \
#     -DEXTRA_CONF_FILE="pt.conf;overlay-eth_common.conf;overlay-arceli_eth_w5500.conf" \
#     -DDTC_OVERLAY_FILE=w5500.overlay
#

CONFIG_ETH_W5500=y
CONFIG_ETH_W5500_TIMEOUT=1000
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=3072
# K_PRIO_COOP(x): smaller x => higher priority (see dect_tether_ipv6 overlay).
CONFIG_ETH_W5500_RX_THREAD_PRIO=8

