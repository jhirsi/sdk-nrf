#
# Static PC IPv6 overlay — disables RA so the PC address and default route
# are configured manually on the PC instead of auto-discovered via RA+DHCPv6.
#
# The DHCPv6 server and FWD module remain enabled so that:
#   - the PC can still obtain its GUA/ULA via DHCPv6 (optional; it may also
#     use a fully static address matching the DECT prefix), and
#   - the FWD module installs the /128 route and neighbor entry when a
#     DHCPv6 Request/Renew is received, enabling bidirectional forwarding.
#
# Append to EXTRA_CONF_FILE, e.g.:
#   -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;eth_static_pc_ipv6.conf"
#
# ── PC setup (do once after flashing) ────────────────────────────────────────
#
# 1. Find the tether gateway's Ethernet link-local address from the device log:
#      <inf> net_l2_dect_br: ... fe80::xxxx:xxxx:xxxx:xxxx
#    or read it with the net shell command:  net iface show
#
# 2. Find the DECT GUA prefix from the device log (e.g. 2001:db8:1:2::/64)
#    or via:  dect status  (shows "Border router global IPv6 address prefix/64")
#
# 3. Windows (PowerShell — run as Administrator):
#
#    # Add a static GUA — use the DECT prefix + any IID of your choice:
#    netsh interface ipv6 add address "Ethernet" 2001:db8:1:2::1/64 store=persistent
#
#    # Add a static default route via the tether gateway link-local:
#    netsh interface ipv6 add route ::/0 "Ethernet" fe80::xxxx:xxxx:xxxx:xxxx store=persistent
#
#    # (Optional) Remove an unwanted existing default route:
#    netsh interface ipv6 delete route ::/0 "Ethernet" <old-gateway>
#
#    Verify:
#    netsh interface ipv6 show addresses "Ethernet"
#    netsh interface ipv6 show route
#
# 4. Linux (ip tool — replace eth0 and addresses as appropriate):
#
#    sudo ip -6 addr add 2001:db8:1:2::1/64 dev eth0
#    sudo ip -6 route add default via fe80::xxxx:xxxx:xxxx:xxxx dev eth0
#
#    Verify:
#    ip -6 addr show eth0
#    ip -6 route show
#
# 5. If the PC still triggers a DHCPv6 exchange the FWD module will install
#    its /128 route automatically.  If you want fully static (no DHCPv6 at
#    all), you must add a code-level change to decouple FWD from DHCPv6 —
#    that is out of scope for this conf overlay.
#
# ─────────────────────────────────────────────────────────────────────────────

# Disable Router Advertisements — the PC configures default route manually.
CONFIG_DECT_TETHER_IPV6_RA=n

# Keep DHCPv6 server so the FWD module can install /128 routes and neighbor
# entries for the PC.  The PC may use DHCPv6 to learn its address or ignore
# it and use a fully static address (step 3/4 above).
CONFIG_DECT_TETHER_IPV6_DHCPV6_SERVER=y
