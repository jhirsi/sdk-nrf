#
# Force the W5500 Ethernet link to 10BASE-T half-duplex. Use this to
# physically rate-limit the host PC so it cannot blast traffic at
# 100 Mbps line rate into the slower DECT NR+ uplink.
#
# Append last in EXTRA_CONF_FILE together with eth_w5500.conf, e.g. with the
# Arceli W5500 shield:
#
#   west build -p -b nrf9151dk/nrf9151/ns -- \
#     -DSHIELD=arceli_eth_w5500 \
#     -DEXTRA_CONF_FILE="pt.conf;eth_common.conf;eth_w5500.conf;eth_w5500_10bt_hd.conf" \
#     -DDTC_OVERLAY_FILE=w5500-static-mac.overlay
#
# Lock the PC to the same mode (10 Mbps Half Duplex). On Windows:
#
#   Set-NetAdapterAdvancedProperty -Name "Ethernet" \
#       -RegistryKeyword "*SpeedDuplex" -RegistryValue 1
#   Restart-NetAdapter -Name "Ethernet"
#
# Why half-duplex and not full-duplex:
# A working 10 Mbps full-duplex link needs both ends to auto-negotiate
# to it. The W5500 cannot auto-negotiate at 10 Mbps only - it either
# advertises every speed (and the link comes up at 100 Mbps, defeating
# the rate-limit goal) or skips auto-negotiation entirely. Without
# auto-negotiation the PC cannot learn the W5500's duplex from the link
# signal, so it falls back to half-duplex per the Ethernet standard.
# Forcing 10 Mbps full-duplex on the W5500 therefore creates a duplex
# mismatch with the PC and TCP throughput collapses.
# 10 Mbps half-duplex avoids the mismatch: both ends explicitly run
# half-duplex, no auto-negotiation needed. Throughput is half of 10
# Mbps full-duplex but the link is clean and predictable.

CONFIG_ETH_W5500_PHY_SPEED_10BT_HD=y
