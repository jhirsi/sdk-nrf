# Shared Ethernet shield Kconfig for dect_tether_ipv6 sample.
#
# EXTRA_CONF_FILE merge order (omit mDNS layers when not needed):
#   eth_common.conf -> eth_w5500.conf | eth_link_board_eth.conf ->
#   mdns-common.conf -> mdns.conf -> eth_mdns.conf -> mdns_forward.conf -> optional extras
#
# From the sample directory (Ethernet only, no mDNS):
#   cd nrf/samples/dect/dect_tether_ipv6
#   west build -p -b nrf9151dk/nrf9151/ns -- \
#     -DSHIELD=arceli_eth_w5500 \
#     -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf" \
#     -DDTC_OVERLAY_FILE=w5500-static-mac.overlay
#
# For mDNS on eth, append mdns-common.conf, mdns.conf, eth_mdns.conf
# (and mdns_forward.conf for the eth0 <-> dect0 tap).
# For a random MAC each boot, use -DDTC_OVERLAY_FILE=w5500.overlay instead.
# For periodic unsolicited NA toward the tethered host, append eth_unsol_na.conf.
#
# Windows 11: RA-learned ::/0 often drops after ~30 s NUD. On the PC use a persistent
# static ::/0 (elevated PowerShell netsh) — see README "Optional static default
# gateway (Windows 11)". Or append eth_max_connectivity.conf (longer NUD interval).
#

# Unicast RA to RS source (RFC 4861); helps Windows install ::/0 at link-up.
CONFIG_DECT_TETHER_IPV6_RA_RS_UNICAST=y

CONFIG_SPI=y

CONFIG_ETH_DRIVER=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y

CONFIG_NET_L2_DECT_MTU=1500

# Using DECT and Ethernet RX threads
#CONFIG_NET_TC_TX_COUNT=0
#CONFIG_NET_TC_RX_COUNT=0

# Optimized for uplink traffic from DECT NR+ PT (=TX) via FT (=RX) to sink Ethernet
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=30720
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=12288

CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=20

CONFIG_NET_PKT_RX_COUNT=30
CONFIG_NET_BUF_RX_COUNT=200

CONFIG_NET_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_INF=y
# Surface "iface N pkt 0x... send failure status -E*" warnings (e.g. W5500 -EIO
# bursts) on this sample; otherwise net_if defaults below WRN and those
# warnings are silently dropped.
CONFIG_NET_IF_LOG_LEVEL_WRN=y

CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=30

# dect0 + eth0
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_IPV6_PREFIX_COUNT=3

CONFIG_DK_LIBRARY=n
