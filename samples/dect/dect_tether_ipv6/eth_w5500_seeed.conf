# Seeed W5500 Ethernet Shield add-on for the W5500 driver. Use together with
# eth_w5500.conf and one of the w5500-seeed*.overlay files, e.g.:
#
#   west build -b nrf9151dk/nrf9151/ns <this_sample> -- \
#     -DSHIELD=seeed_w5500 \
#     -DEXTRA_CONF_FILE="pt.conf;eth_common.conf;eth_w5500.conf;eth_w5500_seeed.conf" \
#     -DDTC_OVERLAY_FILE=w5500-seeed-static-mac.overlay
#
# The Seeed W5500 Ethernet Shield (Rev 1.01) leaves the W5500 INTn disconnected
# (R25 removed), so the interrupt never reaches the MCU and every transmit fails
# with "TX semaphore timeout". Poll mode services SENDOK/RX over SPI instead of
# the INTn line, so the shield works with no INTn wiring. Keep this out of the
# common eth_w5500.conf so shields with a wired INTn (e.g. Arceli) stay purely
# interrupt-driven.
CONFIG_ETH_W5500_POLL_MODE=y
