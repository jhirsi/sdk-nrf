#
# Loss-resilient DLC profile for dect_tether_ipv6 (PT side).
#
# Append last in EXTRA_CONF_FILE, e.g.
#   eth_common.conf;eth_w5500.conf;dlc_resilient.conf
#
# Why: the modem's stock DLC defaults are not a great match for a
# tether deployment. The two knobs below trade them for a "loss-
# resilient" profile that keeps the link up and lets the DLC retry
# across realistic interference bursts, while still bounding worst-
# case queue stall well below the 60 s stock default:
#
#   * SDU lifetime = 1.5 s (NRF_MODEM_DECT_DLC_SDU_LIFETIME_1_5_S = 21):
#     applied to the PT's flow_config[0] at association (the PT->FT
#     direction). In the typical tether scenario the PT sources data
#     toward the Internet, so PT->FT is the heavy uplink. 1.5 s is
#     large enough to absorb several DLC retransmission rounds across
#     short outages without dropping queued payload, but small enough
#     that a fundamentally broken link surfaces in seconds rather
#     than the ~minute that the 60 s stock default would impose.
#     Smaller values (10 ms..100 ms) are appropriate for latency-
#     sensitive workloads where stale SDUs are useless - tune at
#     runtime if needed.
#
#   * discard_release_assoc_count = 20: release after 20 consecutive
#     DLC_DISCARD_TIMER_EXPIRED responses (resets on successful DLC TX).
#     Independent of sdu_lifetime; worst-case reconnect ~ count x lifetime
#     (20 x 1.5 s ~= 30 s on PT->FT). 0 = never release. Runtime values
#     > 1 need Kconfig count > 1 at build time.
#
# The matching FT-side overlay (dect_shell) uses 2.5 s on its FT->PT
# flow; each side controls its own TX-flow lifetime, the two ends do
# NOT need to match.
#
# Both values are also runtime-tunable via the DECT L2 shell:
#   uart:~$ dect sett --dlc_sdu_lifetime 21
#   uart:~$ dect sett --dlc_discard_release_assoc_count 20
#   uart:~$ dect sett --read    # to verify
#
# Valid sdu_lifetime values: 1..31 (0.5 ms..60 s, see
# enum dect_dlc_sdu_lifetime / nrf_modem_dect_dlc_sdu_lifetime) or 255
# for INFINITY.

CONFIG_DECT_MDM_NRF_DLC_SDU_LIFETIME=21
CONFIG_DECT_MDM_NRF_DLC_DISCARD_TIMER_RELEASE_ASSOC_COUNT=20
