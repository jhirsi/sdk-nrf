# Optional: periodic unsolicited NA on host Ethernet (link-local only; ND refresh).
# Append to EXTRA_CONF_FILE, e.g. eth_common.conf;...;eth_unsol_na.conf

CONFIG_DECT_TETHER_IPV6_ETH_UNSOLICITED_NA=y
# NOTE: Windows does NOT implement RFC 4861 §7.2.5 for unsolicited NAs —
# receiving an unsolicited NA (even with Router+Override) does NOT reset the Windows
# NUD reachability timer.  Only solicited NAs (replies to the PC's unicast NS
# probes) or TCP ACKs reset NUD in Windows.  These periodic NAs therefore only
# refresh the tether gateway's link-layer address in the PC's neighbour cache; they do
# NOT prevent NUD probing.  Interval kept at 20 s as an ND-table freshness aid.
CONFIG_DECT_TETHER_IPV6_ETH_UNSOLICITED_NA_INTERVAL_MS=20000
