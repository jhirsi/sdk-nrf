# DECT NR+ RPC client (no DECT modem on this device).

CONFIG_DECT_NR_RPC=y
CONFIG_DECT_NR_RPC_CLIENT=y
CONFIG_DECT_NR_RPC_NET_IF=y
CONFIG_NRF_RPC_UART_TRANSPORT=y
CONFIG_DECT_NR_RPC_UART_TRANSPORT=y

# Larger RX ring for non-reliable UART bursts (shell lines, IF_RECEIVE).
CONFIG_NRF_RPC_UART_RX_RINGBUF_SIZE=8192

CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=4096
CONFIG_NRF_RPC_THREAD_PRIORITY=0

# UART RPC: default is non-reliable (throughput). Use rpc-uart-reliable.conf on
# **both** client and server for per-frame ACK (noisy links).
CONFIG_NRF_RPC_UART_RELIABLE=n
CONFIG_NRF_RPC_RESPONSE_TIMEOUT=50

# Client is follower: do not send group init; wait for server to send it.
CONFIG_NRF_RPC_GROUP_DEFAULT_INITIATOR=n
CONFIG_NRF_RPC_GROUP_INIT_WAIT_TIME=-1

CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_MAX_CONN=6
CONFIG_NET_STATISTICS=y

# ULA / DECT addressing; need room for e.g. link-local + ULA + global per iface.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3

# Enough slots for addresses/prefixes synced from server
CONFIG_NET_IF_MAX_IPV6_COUNT=8
CONFIG_NET_INTERFACE_NAME=y

# Socket services
CONFIG_ZVFS_POLL_MAX=10

CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=16

# mDNS (responder + resolver + DNS-SD + hostname): use mdns.conf

# DNS resolver (unicast; use mdns.conf for *.local / mDNS advertise)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="2001:4860:4860::8888"
CONFIG_NET_SOCKETS_DNS_TIMEOUT=8000

CONFIG_NET_HOSTNAME="dect-rpc-client"

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_NRF_RPC_TR_LOG_LEVEL_INF=y
CONFIG_NRF_RPC_LOG_LEVEL_INF=y

# Shell and console: serial UART
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="dect_rpc_client:~$ "
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_DECT_NR_RPC_CLIENT_SHELL=y

# Ensure logs go to shell UART only (not a separate UART backend)
CONFIG_LOG_BACKEND_UART=n
# Keep printk() ordering consistent with logging (modem_shell / dect_shell).
CONFIG_LOG_PRINTK=n

# TF-M
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y

# Debugging
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_NET_DECT_RPC_LOG_LEVEL_INF=y
