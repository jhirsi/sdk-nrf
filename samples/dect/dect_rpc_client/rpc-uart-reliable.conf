# Extra Kconfig fragment: nRF RPC UART reliable mode (per-frame HDLC ACK + retries).
# Use on both client and server with the same fragment.
#
# Build from this sample directory (see README):
#   west build -p -b nrf9151dk/nrf9151/ns -- -DEXTRA_CONF_FILE=rpc-uart-reliable.conf
#
CONFIG_NRF_RPC_UART_RELIABLE=y
CONFIG_NRF_RPC_UART_ACK_WAITING_TIME=1000
CONFIG_NRF_RPC_UART_TX_ATTEMPTS=7
