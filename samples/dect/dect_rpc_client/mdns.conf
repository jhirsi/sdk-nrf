# Extra mDNS configuration: full mDNS — responder (advertise *.local) + resolver (query *.local).
# Not in default prj.conf to keep the minimal RPC + IP image smaller.

# Responder: advertise peer name on the link
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="dect_rpc_client"
CONFIG_NET_HOSTNAME_DYNAMIC=y

# Resolver: *.local queries to mDNS multicast
CONFIG_MDNS_RESOLVER=y

CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_SERVER2="2001:4860:4860::8844"
CONFIG_DNS_RESOLVER_CACHE=y
CONFIG_NET_SOCKETS_DNS_BACKOFF_INTERVAL=4000

# DNS_DISPATCHER_MAX_POLL grows with MAX_SERVERS + mcast + MDNS_RESPONDER iface count.
CONFIG_ZVFS_POLL_MAX=12

CONFIG_SHELL_STACK_SIZE=4096
