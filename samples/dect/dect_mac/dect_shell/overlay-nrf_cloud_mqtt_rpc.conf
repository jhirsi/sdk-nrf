# IMPORTANT: Disable base nRF RPC transports FIRST to prevent choice default
# This must come before enabling MQTT transport. The order in overlay files
# matters - settings are processed in order, so disabling must happen first.
CONFIG_NRF_RPC_IPC_SERVICE=n
CONFIG_NRF_RPC_UART_TRANSPORT=n

# nRF RPC base configuration (required for DECT RPC)
CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=4096
# For MQTT transport, we use NOWAIT group, so this timeout doesn't apply
# But set to a reasonable value in case other groups need it
CONFIG_NRF_RPC_GROUP_INIT_WAIT_TIME=5000


# Enable DECT RPC with MQTT transport
CONFIG_DECT_NRP_RPC=y
CONFIG_DECT_NRP_RPC_SERVER=y
CONFIG_DECT_NRP_RPC_MQTT_TRANSPORT=y
CONFIG_DECT_NRP_RPC_LOG_LEVEL_DBG=y

CONFIG_DECT_NRP_RPC_LOG_LEVEL_DBG=y