
CONFIG_ETH_DRIVER=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_DK_LIBRARY=n
CONFIG_NET_IPV4=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Phytec eth shield:
# driver: zephyr/drivers/ethernet/eth_enc424j600.c
CONFIG_ETH_ENC424J600_RX_THREAD_PRIO=15
CONFIG_ETH_ENC424J600_RX_THREAD_STACK_SIZE=2048
CONFIG_ETH_W5500_RX_THREAD_PRIO=15
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=2048

CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
#CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"
#CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"

CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV6=y
#CONFIG_DNS_SERVER_IP_ADDRESSES=y
#CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000
