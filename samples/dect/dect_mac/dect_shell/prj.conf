#CONFIG_NRF_MODEM_LIB_LOG_LEVEL_DBG=y
#CONFIG_LOG_MODE_IMMEDIATE=y
#CONFIG_NET_CORE_LOG_LEVEL_DBG=y
#CONFIG_NET_CONTEXT_LOG_LEVEL_DBG=y
#CONFIG_NET_IF_LOG_LEVEL_DBG=y
#CONFIG_NET_IPV6_ND_LOG_LEVEL_DBG=y
