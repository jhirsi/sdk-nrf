# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_MAC=y
CONFIG_NRF_MODEM_VARIANT_DECT_MAC=y
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=6144
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=12288

# Force default trace level to default (coredump_only)
# CONFIG_NRF_MODEM_LIB_TRACE_LEVEL_COREDUMP_ONLY=y
CONFIG_NRF_MODEM_LIB_CFUN_HOOKS=n

# Fido as a default
CONFIG_NRF_MODEM_LIB_TRACE=n

# Disable fidoless default log level override
#CONFIG_NRF_MODEM_LIB_TRACE_LEVEL_OVERRIDE=n

#CONFIG_NRF_MODEM_LIB_SYS_INIT=n
#CONFIG_NRF_MODEM_LOG=y
#CONFIG_NRF_MODEM_LIB_LOG_LEVEL_DBG=y
#CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_NET_CONNECTION_MANAGER=y
#CONFIG_NET_L2_DECT_CONN_MGR_CONNECTION_PERSISTENCE=y
#CONFIG_NET_L2_DECT_CONN_MGR_CONNECT_TIMEOUT_SECONDS=120
#CONFIG_NET_L2_DECT_CONN_MGR_AUTO_CONNECT=y
CONFIG_DECT_NRP_MAC_NET_IF_NO_AUTO_START=y

# DECT NR+
CONFIG_DECT_NRP_MAC=y
CONFIG_DECT_NRP_MAC_DRIVER_NRF=y

#CONFIG_DECT_NRP_MAC_NET_IF_NO_AUTO_START=y

# Disable auto antenna config
CONFIG_MODEM_ANTENNA=n

#To bypass error print from Modem Antenna Lib because dect mfw does not support this
CONFIG_MODEM_ANTENNA_AT_COEX0=""

# For getting modem fw version and hw version
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=n
CONFIG_MODEM_INFO_ADD_SIM=n

# Zephyr networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_STATISTICS=y

CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=y
#Might be expensive? SHould this be disabled?
#CONFIG_NET_IP_ADDR_CHECK=n

# Required for getting OFFLOADED_NETDEV for dect nrf91 driver
#CONFIG_NET_OFFLOAD=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_INFO_DEFAULT_DATA_SIZE=208

CONFIG_NET_L2_DECT_MGMT=y
CONFIG_NET_L2_DUMMY=n
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_INTERFACE_NAME_LEN=15

CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

CONFIG_NET_IF_MAX_IPV6_COUNT=2

CONFIG_NET_SOCKETS=y

#For sending raw packets
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_NET_SOCKETS_PACKET_DGRAM=y
CONFIG_NET_SOCKETS_INET_RAW=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Network buffers
CONFIG_NET_BUF=y
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_BUF_POOL_USAGE=y

CONFIG_NET_PKT_RX_COUNT=15
CONFIG_NET_BUF_RX_COUNT=30

CONFIG_NET_PKT_TX_COUNT=15
CONFIG_NET_BUF_TX_COUNT=30

CONFIG_NET_TC_RX_COUNT=0

#IPv6 support
CONFIG_NET_IPV6=y
CONFIG_NET_MGMT_EVENT_LOG_LEVEL_INF=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_ND=y

CONFIG_DECT_NRP_MAC_CLUSTER_MAX_CHILD_ASSOCIATION_COUNT=50
CONFIG_NET_IPV6_MAX_NEIGHBORS=50

# Disable certain parts of Zephyr IPv6 stack
#CONFIG_NET_IPV6_ND=n
#CONFIG_NET_IPV6_DAD=n
#CONFIG_NET_IPV6_NBR_CACHE=n
#CONFIG_NET_IPV6_MLD=n
#CONFIG_NET_IPV6_DAD=n
#CONFIG_NET_IPV6_FRAGMENT=n

CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=y
CONFIG_DNS_RESOLVER_CACHE=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
#CONFIG_DNS_RESOLVER_MAX_SERVERS=6
#TODO: dns servers from FT/sink?
CONFIG_DNS_SERVER1="2001:4860:4860::8888"
CONFIG_NET_SOCKETS_DNS_TIMEOUT=8000
#CONFIG_DNS_NUM_CONCUR_QUERIES=5
#CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=2
#CONFIG_DNS_RESOLVER_ADDITIONAL_QUERIES=2

# Enable mDNS support
CONFIG_MDNS_RESOLVER=y

#Increased due to crash in /ncs/zephyr/subsys/net/lib/dns/dispatcher.c:113
#CONFIG_ZVFS_OPEN_MAX=24

# (M)DNS
CONFIG_NET_SOCKETS_POLL_MAX=10
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y #TODO: addvertise services
CONFIG_MDNS_RESPONDER_DNS_SD=y
CONFIG_NET_HOSTNAME_ENABLE=y
#Hostname can be set by using command hostname
CONFIG_NET_HOSTNAME="dect-nrp-device"
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME_UNIQUE=n

# Disable POSIX uname support to suppress build warning that hostname is too long.
#CONFIG_POSIX_UNAME=n

# Need bigger stack to send responses
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

#CONFIG_NET_ROUTE_MCAST=y
#CONFIG_NET_MCAST_ROUTE_MLD_REPORTS=y

#*************************
#disable for now, some will be enabled in other overlays if needed
CONFIG_NET_IPV4=n
CONFIG_MBEDTLS=n
CONFIG_NORDIC_SECURITY_BACKEND=n
#CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_MBEDTLS_TLS_VERSION_1_2=n
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n

#*************************

# Shell configurations
CONFIG_SHELL=y

CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS_USER_API=y

CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_PROMPT_UART="desh:~$ "
CONFIG_SHELL_ARGC_MAX=40
# -h and --help options are handled in Dect Shell
CONFIG_SHELL_HELP_OPT_PARSE=n

# Command line buffer is set this large to enable writing of certificates by using at commands
CONFIG_SHELL_CMD_BUFF_SIZE=4096

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=9216

# Shell RX buffer needs to be increased to avoid problems with test automation
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
# Use interrupt driven shell UART, otherwise we won't be able to suspend the UART
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y

# Enable use of vsnprintfcb() for extending desh_print() format
CONFIG_CBPRINTF_LIBC_SUBSTS=y

# we keep newlib still for dev time because no mallinfo() support in zephyr
# see mosh commit: https://github.com/nrfconnect/sdk-nrf/commit/b3e117f2260be747938b8578ac525ff0f9d44884
CONFIG_MINIMAL_LIBC=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
#CONFIG_CJSON_LIB=y

# freebsd-getopt
CONFIG_GETOPT_LIB=y
CONFIG_POSIX_API=y
# Need to disable devmem shell since it enforces Zephyr's internal version of getopt
CONFIG_DEVMEM_SHELL=n

CONFIG_DK_LIBRARY=y

CONFIG_AT_MONITOR=y
CONFIG_AT_PARSER=y

CONFIG_ISR_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=25600
CONFIG_AT_MONITOR_HEAP_SIZE=512

# Settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS_LOG_LEVEL_WRN=y

# Kernel options
CONFIG_ENTROPY_GENERATOR=y
#CONFIG_REBOOT=y

# Debugging configurations
CONFIG_ASSERT=y
CONFIG_LOG=y

# Keep printk() synchronous
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=n

CONFIG_DEBUG_INFO=y
#CONFIG_DEBUG_OPTIMIZATIONS=y
#CONFIG_NO_OPTIMIZATIONS=y
#CONFIG_FORCE_NO_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
#CONFIG_ASSERT_LEVEL=2
#CONFIG_ASSERT_ON_ERRORS=y
#CONFIG_FAULT_DUMP=2
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_EXTRA_EXCEPTION_INFO=y
#CONFIG_WATCHDOG=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Enable TF-M logging on UART0
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y

CONFIG_NET_LOG=y
