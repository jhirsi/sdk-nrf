CONFIG_UART_ASYNC_API=y
CONFIG_UART_1_ASYNC=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n

# Align with the Serial LTE Modem (SLM) application.
CONFIG_MODEM_CMUX_MTU=127
CONFIG_MODEM_CMUX_WORK_BUFFER_SIZE=536
CONFIG_MODEM_CELLULAR_UART_BUFFER_SIZES=6000

# Prevent sockets getting offloaded to the modem.
CONFIG_NET_SOCKETS_OFFLOAD=n

# Print logs and printk() output on uart0.
CONFIG_LOG_BACKEND_UART=y

# Disable AT shell as SLM application has no AT mode user pipes
CONFIG_MODEM_AT_SHELL=n

CONFIG_POSIX_API=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_PPP=y
#CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS_USER_API=y

# DNS
CONFIG_DNS_RESOLVER=y
CONFIG_NET_L2_PPP_OPTION_DNS_USE=y

# Network management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# Modem driver
CONFIG_MODEM=y
CONFIG_PM_DEVICE=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_PERIODIC_SCRIPT_MS=20000

# Statistics
CONFIG_MODEM_STATS=y
CONFIG_SHELL=y

# Testing
CONFIG_PM_DEVICE_SHELL=y
#CONFIG_SHELL_WILDCARD=n

# Logging
CONFIG_LOG=y
CONFIG_MODEM_MODULES_LOG_LEVEL_INF=y
CONFIG_MODEM_LOG_LEVEL_INF=y

# For extra verbosity
#CONFIG_MODEM_CMUX_LOG_LEVEL_DBG=y
#CONFIG_LOG_BUFFER_SIZE=65536