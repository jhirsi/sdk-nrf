
CONFIG_DESH_CLOUD_COAP=y
CONFIG_DESH_NATIVE_TLS=y
CONFIG_DESH_NATIVE_TLS_CREDENTIAL_BUFFER_SIZE=4096
CONFIG_SETTINGS_SHELL=y

# Stacks
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# For shadow information
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=n
CONFIG_MODEM_INFO_ADD_DEVICE=y
CONFIG_MODEM_INFO_ADD_DATE_TIME=n
CONFIG_MODEM_INFO_ADD_SIM=n
CONFIG_MODEM_INFO_ADD_SIM_ICCID=n
CONFIG_MODEM_INFO_ADD_SIM_IMSI=n

## Disable Modem/LTE/nrf91-specific features
#CONFIG_NRF_MODEM_LIB=n

CONFIG_AT_HOST_LIBRARY=n
CONFIG_LTE_LINK_CONTROL=n
CONFIG_LTE_PSM_REQ=n

# nRF Cloud
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_MQTT=n
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_COAP_DOWNLOADS=n
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS=y
CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_CONN_INF=y
CONFIG_NRF_CLOUD_DEVICE_STATUS_ENCODE_VOLTAGE=y

CONFIG_NRF_CLOUD_SEND_SERVICE_INFO_FOTA=n

#Not using JWT from modem
CONFIG_NRF_CLOUD_JWT_SOURCE_CUSTOM=y

CONFIG_NRF_CLOUD_ALERT=y
CONFIG_NRF_CLOUD_LOCATION=n

# We need to set time, we are using only NTP
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y
CONFIG_DATE_TIME_THREAD_STACK_SIZE=3072

#CONFIG_DATE_TIME_LOG_LEVEL_DBG=y
CONFIG_DATE_TIME_MODEM=n
## Disable LTE-event-driven date_time updates (the date_time library will still periodically
## refresh its timestamp, this setting only controls whether LTE-event-driven date_time updates
## are enabled)
CONFIG_DATE_TIME_AUTO_UPDATE=n

## Enable date_time retries for dect nr+
## This prevents occasional DNS lookup flukes from
## rendering the device unable to connect until the next
## CONFIG_DATE_TIME_UPDATE_INTERVAL_SECONDS elapses (default 4 hours)
CONFIG_DATE_TIME_RETRY_COUNT=5
# Use a really short retry interval for demo purposes
# 60 seconds to 15 minutes is probably more appropriate for
# real-world applications
CONFIG_DATE_TIME_RETRY_INTERVAL_SECONDS=20

# 2 options for cert, stored by %CMNG in zephyr side or in a code

# 2 options for client id: compile time IMEI OR runtime dev UUID
## To use compile-time client ID for nRF Cloud
#CONFIG_NRF_CLOUD_CLIENT_ID_SRC_COMPILE_TIME=y
# User must set their compile time client ID
#CONFIG_NRF_CLOUD_CLIENT_ID="50345053-3639-4cf9-80fd-240a783bb3fb"

## default: To use device id from modem
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y
CONFIG_MODEM_JWT=y

#Enable following two if you are using certs from header file (instead of using custom cmng command)
CONFIG_NRF_CLOUD_PROVISION_CERTIFICATES=n
CONFIG_NRF_CLOUD_CREDENTIALS_MGMT_TLS_CRED=n
#CONFIG_NRF_CLOUD_MQTT_MESSAGE_BUFFER_LEN=6144
#CONFIG_NRF_CLOUD_MQTT_PAYLOAD_BUFFER_LEN=6144

## Disable cloud features reliant on or specific to nrf91 modem features
CONFIG_NRF_CLOUD_WIFI_LOCATION_ENCODE_OPT_MAC_RSSI=n
CONFIG_NRF_CLOUD_AGNSS=n
CONFIG_NRF_CLOUD_PGPS=n
CONFIG_NRF_CLOUD_PGPS_REQUEST_UPON_INIT=n
CONFIG_LOCATION_METHOD_GNSS=n
CONFIG_LOCATION_METHOD_CELLULAR=n



## Disable FOTA to conserve memory
CONFIG_NRF_CLOUD_FOTA=n
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_IMG_MANAGER=n


# Zephyr networking stack
CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
CONFIG_NET_CONTEXT_SNDTIMEO=y

CONFIG_NET_TCP=n
CONFIG_NET_IPV4=n

CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=60000

#CONFIG_NRF_CLOUD_SEC_TAG=1

# Enable legacy crypto support
CONFIG_NRF_SECURITY=y
CONFIG_NORDIC_SECURITY_BACKEND=y

## Configure native MBEDTLS to support nRF Cloud MQTT
CONFIG_MQTT_LIB_TLS=n
#CONFIG_MQTT_KEEPALIVE=120
#CONFIG_MQTT_LIB_TLS_USE_ALPN=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=20480
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n

CONFIG_MBEDTLS_TLS_LIBRARY=y
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
CONFIG_MBEDTLS_X509_LIBRARY=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_DTLS=y
CONFIG_MBEDTLS_SSL_SRV_C=y
CONFIG_MBEDTLS_SSL_COOKIE_C=y
CONFIG_MBEDTLS_SSL_DTLS_HELLO_VERIFY=y
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y
CONFIG_NET_SOCKETS_ENABLE_DTLS=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=2048
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048

# Enable AES
#CONFIG_MBEDTLS_AES_C=y
#CONFIG_MBEDTLS_CCM_C=y
CONFIG_MBEDTLS_GCM_C=y
#CONFIG_MBEDTLS_CIPHER_MODE_CBC=y

# Enable ECC
CONFIG_MBEDTLS_ECP_C=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

## Disable unneeded MBEDTLS features to save flash and RAM
CONFIG_MBEDTLS_CHACHA20_C=n
CONFIG_MBEDTLS_CHACHAPOLY_C=n
CONFIG_MBEDTLS_POLY1305_C=n
CONFIG_MBEDTLS_SHA1_C=n
CONFIG_MBEDTLS_MAC_SHA256_ENABLED=n
CONFIG_MBEDTLS_CIPHER_MODE_CBC=n

CONFIG_MBEDTLS_CTR_DRBG_C=n
CONFIG_MBEDTLS_DHM_C=n
CONFIG_MBEDTLS_CMAC_C=n
CONFIG_MBEDTLS_CIPHER_MODE_CTR=n
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_RSA_ENABLED=n

# POSIX API memory optimizations
CONFIG_POSIX_FD_MGMT=n
CONFIG_POSIX_MESSAGE_PASSING=n
CONFIG_POSIX_THREAD_THREADS_MAX=0

# Debug
#CONFIG_NRF_CLOUD_LOG_LEVEL_DBG=y
#CONFIG_NRF_PROVISIONING_LOG_LEVEL_DBG=y
#CONFIG_COAP_LOG_LEVEL_DBG=y
#CONFIG_NRF_CLOUD_LOG_LEVEL_DBG=y
#CONFIG_MQTT_LOG_LEVEL_DBG=y

#CONFIG_MBEDTLS_DEBUG=y
#CONFIG_MBEDTLS_SSL_CLI_C=y
#CONFIG_MBEDTLS_DEBUG_C=y

#CONFIG_MBEDTLS_SSL_DEBUG_ALL=y

#CONFIG_MBEDTLS_LOG_LEVEL_DBG=y
#CONFIG_MBEDTLS_SSL_DEBUG_ALL=y
#CONFIG_NET_LOG=y
#CONFIG_NET_TCP_LOG_LEVEL_INF=y


# Modem
#CONFIG_MODEM_KEY_MGMT=n
#CONFIG_MODEM_JWT=n


# Network
CONFIG_POSIX_API=y
CONFIG_NET_SOCKETS_TLS_SET_MAX_FRAGMENT_LENGTH=y
CONFIG_NET_SOCKETS_OFFLOAD_PRIORITY=40

# CoAP Client
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=40
