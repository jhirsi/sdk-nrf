# Enable debug logging for DECT NR+ stack components
CONFIG_DECT_NRP_MAC_LOG_LEVEL_DBG=y
CONFIG_NET_L2_DECT_LOG_LEVEL_DBG=y
CONFIG_NET_L2_DECT_MGMT_LOG_LEVEL_DBG=y
CONFIG_NET_L2_DECT_BR_LOG_LEVEL_DBG=y
CONFIG_NET_L2_DECT_CONN_MGR_LOG_LEVEL_DBG=y

# Enable debug logging for nRF RPC transport
CONFIG_NRF_RPC_TR_LOG_LEVEL_DBG=y
CONFIG_NRF_RPC_LOG_LEVEL_DBG=y

# Enable debug logging for UART (if using UART transport)
CONFIG_UART_LOG_LEVEL_DBG=y

# Increase log buffer for more verbose output
CONFIG_LOG_BUFFER_SIZE=16384

