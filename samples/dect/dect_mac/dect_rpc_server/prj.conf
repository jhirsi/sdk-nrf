# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LINK_BINARY_DECT_MAC=y
CONFIG_NRF_MODEM_VARIANT_DECT_MAC=y
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=6144
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=12288
CONFIG_NRF_MODEM_LIB_CFUN_HOOKS=n
CONFIG_NRF_MODEM_LIB_TRACE=n

# Settings (required for DECT_NRP_MAC)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# DECT NR+
CONFIG_DECT_NRP_MAC=y
CONFIG_DECT_NRP_MAC_DRIVER_NRF=y
CONFIG_DECT_NRP_MAC_NET_IF_NO_AUTO_START=n
CONFIG_NET_L2_DECT=y
CONFIG_NET_L2_DECT_MGMT=y

# Disable auto antenna config
CONFIG_MODEM_ANTENNA=n
CONFIG_MODEM_ANTENNA_AT_COEX0=""

# For getting modem fw version and hw version
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=n
CONFIG_MODEM_INFO_ADD_SIM=n

# Zephyr networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_STATISTICS=y

CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=y
CONFIG_NET_IP_ADDR_CHECK=n

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_INFO_DEFAULT_DATA_SIZE=208

CONFIG_NET_L2_DUMMY=n
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_INTERFACE_NAME_LEN=15

CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

CONFIG_NET_IF_MAX_IPV6_COUNT=2

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=n

# nRF RPC
CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=6144
CONFIG_NRF_RPC_GROUP_INIT_WAIT_TIME=-1

# Transport selection: UART or MQTT
# Default: UART transport
# To use MQTT transport, use overlay: -- -DOVERLAY_CONFIG=overlay-mqtt.conf
# To use UART transport, use overlay: -- -DOVERLAY_CONFIG=overlay-uart.conf

# Default: UART transport
CONFIG_NRF_RPC_UART_TRANSPORT=y
CONFIG_NRF_RPC_UART_RELIABLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Disable MQTT transport by default
CONFIG_DECT_NRP_RPC_MQTT_TRANSPORT=n
CONFIG_NRF_CLOUD=n

# DECT RPC Server
CONFIG_DECT_NRP_RPC=y
CONFIG_DECT_NRP_RPC_SERVER=y
CONFIG_DECT_NRP_RPC_LOG_LEVEL_DBG=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n

# Explicitly disable SHELL to avoid circular dependency with NRF_RPC_UTILS_REMOTE_SHELL
CONFIG_SHELL=n

# Asserts
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_ASSERT_ON_ERRORS=y

# RPC Utils (required if client uses RPC Utils)
CONFIG_NRF_RPC_UTILS=y
CONFIG_NRF_RPC_UTILS_SERVER=y
CONFIG_NRF_RPC_UTILS_DEV_INFO=y
CONFIG_NRF_RPC_UTILS_SYSTEM_HEALTH=y
# Note: CONFIG_NRF_RPC_UTILS_REMOTE_SHELL requires CONFIG_SHELL, which is disabled

