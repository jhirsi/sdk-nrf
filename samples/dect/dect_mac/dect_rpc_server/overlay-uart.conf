# UART transport configuration overlay
# Use this overlay to enable UART transport for DECT RPC:
# west build -b nrf9151dk/nrf9151/ns -- -DOVERLAY_CONFIG=overlay-uart.conf

# UART transport for nRF RPC
CONFIG_NRF_RPC_UART_TRANSPORT=y
CONFIG_NRF_RPC_UART_RELIABLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Disable MQTT transport
CONFIG_DECT_NRP_RPC_MQTT_TRANSPORT=n
CONFIG_NRF_CLOUD=n

