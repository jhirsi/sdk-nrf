# MQTT transport configuration overlay
# Use this overlay to enable MQTT transport for DECT RPC:
# west build -b nrf9151dk/nrf9151/ns -- -DOVERLAY_CONFIG=overlay-mqtt.conf
#
# IMPORTANT: The order matters - disable base transports FIRST to prevent
# the NRF_RPC_TRANSPORT choice from defaulting to IPC_SERVICE

# Disable base nRF RPC transports (required for MQTT transport)
CONFIG_NRF_RPC_IPC_SERVICE=n
CONFIG_NRF_RPC_UART_TRANSPORT=n

# nRF Cloud MQTT
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_MQTT=y

# DECT RPC with MQTT transport
CONFIG_DECT_NRP_RPC_MQTT_TRANSPORT=y
