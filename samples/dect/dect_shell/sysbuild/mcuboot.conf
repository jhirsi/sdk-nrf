# Sysbuild MCUboot fragment for dect_shell.
#
# thingy91x_nrf9151 mcuboot uses CONFIG_SPI_NOR=y to access the external
# flash that hosts the secondary slot. mcuboot's Kconfig defaults
# CONFIG_MULTITHREADING=n on SOC_FAMILY_NORDIC_NRF, but the SPIM bus
# driver (zephyr/drivers/spi/spi_nrfx_spim.c) unconditionally uses
# k_sem_init/take/give for its PM wake handler, so without
# multithreading the link fails with:
#   undefined reference to z_impl_k_sem_give / k_sem_init / k_sem_take
#
# Other comparable nRF91 mcuboot board overlays (sparkfun_thing_plus,
# actinius_icarus*, circuitdojo_feather, thingy91_nrf52840, etc.) all
# enable MULTITHREADING; thingy91x_nrf9151.conf does not. Re-enable it
# here for any board this sample is built against - on nrf9151dk the
# extra cost is negligible and mcuboot has plenty of headroom.
CONFIG_MULTITHREADING=y
