#
# Enables dect_shell mDNS sample features on top of prj.conf (mDNS stack is already on).
# Use when you want DNS-SD advertisement on dect0 and the ``dect discover`` command.
# With CONFIG_NET_L2_DECT_ULA, ``dect discover`` prints an on-link ULA column; DNS-SD
# refresh on dect0 IPv6 address changes keeps advertised AAAA aligned with ULA.
#
# Build: west build ... -- -DEXTRA_CONF_FILE=mdns-discover.conf

CONFIG_DECT_SHELL_MDNS_DNS_SD_ADVERTISE=y
CONFIG_DECT_SHELL_MDNS_DISCOVER=y

# PTR additional: all unicast IPv6 on the interface that received the query (e.g. LL + ULA).
CONFIG_MDNS_RESPONDER_DNS_SD_MULTIPLE_AAAA=y

# RFC 6762 §11: mDNS responses (including unicast replies) MUST be sent with IPv6
# hop limit 255; receivers (e.g. Windows) silently drop unicast mDNS with HL<255.
# Zephyr's mdns_responder sets IPV6_MULTICAST_HOPS=255 for the multicast path but
# leaves the unicast reply socket at the system default (CONFIG_NET_INITIAL_HOP_LIMIT,
# normally 64). Lift the default to 255 so unicast mDNS replies are RFC compliant.
CONFIG_NET_INITIAL_HOP_LIMIT=255

# mDNS uses dns_id 0; extra slots reduce -EAGAIN if resolver overlaps other work
CONFIG_DNS_NUM_CONCUR_QUERIES=4

# Larger dns_msg_pool (dispatcher + resolver) under mDNS bursts
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=4
CONFIG_MDNS_RESOLVER_ADDITIONAL_BUF_CTR=4

# Decrease RAM consumption to fit into constrained 128KB SRAM on nRF9161.
CONFIG_NET_PKT_TX_COUNT=15
CONFIG_NET_BUF_TX_COUNT=30

CONFIG_NET_PKT_RX_COUNT=50
CONFIG_NET_BUF_RX_COUNT=100

CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=9184
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=12288