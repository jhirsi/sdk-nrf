#
# dect_shell DNS-SD advertisement + ``dect discover``. Merge after mdns-common.conf.
# For Ethernet + discover, use:
#   eth_common.conf;eth_w5500.conf;mdns-common.conf;mdns-discover.conf;eth_mdns.conf
#
# From the sample directory:
#   cd nrf/samples/dect/dect_shell
#   west build -p -b nrf9151dk/nrf9151/ns -- \
#     -DEXTRA_CONF_FILE="mdns-common.conf;mdns-discover.conf"

CONFIG_DECT_SHELL_MDNS_DNS_SD_ADVERTISE=y
CONFIG_DECT_SHELL_MDNS_DISCOVER=y

# Decrease RAM consumption to fit into constrained 128KB SRAM on nRF9161.
CONFIG_NET_PKT_TX_COUNT=15
CONFIG_NET_BUF_TX_COUNT=30

CONFIG_NET_PKT_RX_COUNT=50
CONFIG_NET_BUF_RX_COUNT=100

CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=9184
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=12288
