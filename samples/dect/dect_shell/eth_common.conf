# Shared Kconfig for DECT shell Ethernet sink builds (link_board_eth and Arceli W5500).
# Merge before the shield-specific overlay, for example:
#   -DEXTRA_CONF_FILE="eth_common.conf;eth_link_board_eth.conf"
#   -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf"
#

# Usually these overlays are used when acting as FT/sink
CONFIG_DECT_DEFAULT_DEV_TYPE_FT=y
CONFIG_NET_HOSTNAME="dect-eth-sink"

CONFIG_NET_L2_DECT_BR_IPV6_ETH_UPSTREAM_PREFIX_ROUTE=y
CONFIG_SPI=y

CONFIG_ETH_DRIVER=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y

CONFIG_NET_L2_DECT_MTU=1500

CONFIG_NET_ROUTING=y
CONFIG_NET_L2_DECT_BR_IPV6_ETH_ND_PROXY_PT_NS_UNICAST_INTERCEPT=y

# Using DECT and Ethernet RX threads
#CONFIG_NET_TC_TX_COUNT=0
#CONFIG_NET_TC_RX_COUNT=0

# Optimized for uplink traffic from DECT NR+ PT (=TX) via FT (=RX) to sink Ethernet
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=12288
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=30720

CONFIG_NET_PKT_TX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=40

CONFIG_NET_PKT_RX_COUNT=50
CONFIG_NET_BUF_RX_COUNT=100

# DECT + sink Ethernet: more IPv6 interfaces, addresses, and prefixes than defaults
CONFIG_NET_IF_MAX_IPV6_COUNT=6
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_IPV6_PREFIX_COUNT=4

# Decrease neighbor count from desh defaults to have memory for other things
CONFIG_DECT_CLUSTER_MAX_CHILD_ASSOCIATION_COUNT=25
CONFIG_NET_IPV6_MAX_NEIGHBORS=25

# Extra multicast groups on behalf of DECT NR+ PT devices
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=25

# Room for events from DECT + Ethernet
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=30

# Disable DK library to avoid button/Arduino pin conflicts with shields
CONFIG_DK_LIBRARY=n

#CONFIG_NET_MAX_ROUTERS=2

CONFIG_DNS_RESOLVER_MAX_SERVERS=3

# Order matters: the resolver sends to the first matching server and stops after
# the first successful UDP send. It only skips non-mDNS servers for *.local;
# for ordinary names it would hit an mDNS slot first if listed first — so put
# unicast resolvers first, then scoped mDNS on DECT (suffix = DECT_MDM_DEVICE_NAME).
# If .local fails: CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=y; watch SO_BINDTODEVICE errors.
CONFIG_DNS_SERVER1="2001:4860:4860::8888%eth0"
CONFIG_DNS_SERVER2="2001:4860:4860::8844%eth0"
CONFIG_DNS_SERVER3="[ff02::fb]:5353%dect0"

# Resolver + per-iface mDNS responder: default NET_MAX_CONTEXTS (6) is tight.
CONFIG_NET_MAX_CONTEXTS=12

# prj.conf sets CONFIG_ZVFS_POLL_MAX=10; DNS dispatcher needs resolver slots
# (MAX_SERVERS + mcast) + MDNS_MAX_POLL (NET_IF_MAX_IPV6_COUNT) + margin — raise
# or net_sock_svc fails and dns_resolve_init returns -EAGAIN (-5).
CONFIG_ZVFS_POLL_MAX=16

#CONFIG_NET_IPV6_ND_LOG_LEVEL_INF=y
#CONFIG_NET_ICMPV6_LOG_LEVEL_DBG=y
#CONFIG_NET_SHELL_IPV6_SUPPORTED=y

CONFIG_NET_L2_DECT_LOG_LEVEL_INF=y
CONFIG_LOG_CMDS=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y