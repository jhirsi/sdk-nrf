sample:
  name: DECT NR+ Shell Sample
common:
  tags:
    - ci_build
    - sysbuild
    - ci_samples_dect
  sysbuild: true
  build_only: true
  integration_platforms:
    - nrf9151dk/nrf9151/ns
  platform_allow:
    - nrf9151dk/nrf9151/ns
    - thingy91x/nrf9151/ns
tests:
  sample.dect.dect_shell: {}
  sample.dect.dect_shell.mdns_discover:
    extra_args: EXTRA_CONF_FILE=mdns-common.conf;mdns-discover.conf
  sample.dect.dect_shell.ft_sink:
    extra_args: FILE_SUFFIX=sm
  sample.dect.dect_shell.ft_sink_thingy91x:
    integration_platforms:
      - thingy91x/nrf9151/ns
    extra_args: FILE_SUFFIX=sm PM_STATIC_YML_FILE="pm_static_thingy91x_nrf9151_ns.yml.manual"
  sample.dect.dect_shell.iperf3_tx:
    extra_args: EXTRA_CONF_FILE="iperf3-common.conf;iperf3-tx.conf"
  sample.dect.dect_shell.iperf3_rx:
    extra_args: EXTRA_CONF_FILE="iperf3-common.conf;iperf3-rx.conf"
  sample.dect.dect_shell.nrf_cloud_mqtt:
    extra_args: EXTRA_CONF_FILE="nrf_cloud_mqtt.conf"
  sample.dect.dect_shell.nrf_cloud_coap:
    extra_args: EXTRA_CONF_FILE="nrf_cloud_coap.conf"
  sample.dect.dect_shell.arceli_eth_w5500:
    extra_args: SHIELD=arceli_eth_w5500 EXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf" DTC_OVERLAY_FILE=w5500-static-mac.overlay
  sample.dect.dect_shell.arceli_eth_w5500_random_mac:
    extra_args: SHIELD=arceli_eth_w5500 EXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf" DTC_OVERLAY_FILE=w5500.overlay
  sample.dect.dect_shell.seeed_eth_w5500:
    extra_args: SHIELD=seeed_w5500 EXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf" DTC_OVERLAY_FILE=w5500-seeed-static-mac.overlay
  sample.dect.dect_shell.seeed_eth_w5500_random_mac:
    extra_args: SHIELD=seeed_w5500 EXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf" DTC_OVERLAY_FILE=w5500-seeed.overlay
  sample.dect.dect_shell.link_board_eth:
    extra_args: SHIELD=link_board_eth EXTRA_CONF_FILE="eth_common.conf;eth_link_board_eth.conf" DTC_OVERLAY_FILE=link_board_eth.overlay
  sample.dect.dect_shell.arceli_eth_w5500_mdns:
    extra_args: SHIELD=arceli_eth_w5500 EXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;mdns-common.conf;eth_mdns.conf" DTC_OVERLAY_FILE=w5500-static-mac.overlay
  sample.dect.dect_shell.seeed_eth_w5500_mdns:
    extra_args: SHIELD=seeed_w5500 EXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;mdns-common.conf;eth_mdns.conf" DTC_OVERLAY_FILE=w5500-seeed-static-mac.overlay
  sample.dect.dect_shell.link_board_eth_mdns:
    extra_args: SHIELD=link_board_eth EXTRA_CONF_FILE="eth_common.conf;eth_link_board_eth.conf;mdns-common.conf;eth_mdns.conf" DTC_OVERLAY_FILE=link_board_eth.overlay
