#
# Optional overlay enabling DHCPv6 client on the Ethernet interface for the
# DECT shell FT/sink build.  Merge on top of eth_common.conf, for example:
#   -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf;mdns-common.conf;eth_mdns.conf;eth_dhcpv6_client.conf"
#
# The DHCPv6 client is started automatically when the Ethernet interface
# comes up (see dect_net_l2_sink.c).  It requests a global unicast address
# (IA_NA) in addition to the SLAAC address already assigned by the router.
#

CONFIG_NET_DHCPV6=y
CONFIG_NET_DHCPV6_RAPID_COMMIT=y
CONFIG_NET_DHCPV6_LOG_LEVEL_DBG=y
CONFIG_NET_UDP_LOG_LEVEL_DBG=y
