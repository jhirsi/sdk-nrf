#
# Loss-resilient DLC profile for dect_shell (FT / sink side).
#
# Append last in EXTRA_CONF_FILE, e.g. with the W5500 ethernet sink:
#   eth_common.conf;eth_w5500.conf;dlc_resilient.conf
#
# Or combined with the private DECT RX pool overlay:
#   eth_common.conf;eth_w5500.conf;dect_rx_pool.conf;dlc_resilient.conf
#
# Why: the modem's stock DLC defaults are not a great match for a
# tether/sink deployment. The two knobs below trade them for a "loss-
# resilient" profile that keeps the link up and lets the DLC retry
# across realistic interference bursts, while still bounding worst-
# case queue stall well below the 60 s stock default:
#
#   * SDU lifetime = 2.5 s (NRF_MODEM_DECT_DLC_SDU_LIFETIME_2_5_S = 23):
#     applied to the FT's default_tx_flow_config[0] advertised at
#     cluster start (i.e. the FT->PT direction). In the typical tether
#     topology the PT sources data toward the Internet, so PT->FT is
#     the heavy uplink and FT->PT mostly carries small TCP ACKs and
#     control back to the PT. We pick 2.5 s here (slightly more
#     tolerant than the 1.5 s used on the PT side) because dropping
#     a return-path ACK forces TCP to retransmit on the already-
#     saturated uplink, which hurts throughput more than an ACK that
#     is delivered late. Smaller values (10 ms..100 ms) are
#     appropriate for latency-sensitive workloads where stale SDUs
#     are useless - tune at runtime if needed.
#
#   * discard_release_assoc_count = 20: release after 20 consecutive
#     DLC_DISCARD_TIMER_EXPIRED responses (resets on successful DLC TX).
#     Independent of sdu_lifetime; worst-case reconnect ~ count x lifetime
#     (20 x 2.5 s ~= 50 s on FT->PT). 0 = never release. Runtime values
#     > 1 need Kconfig count > 1 at build time.
#
# The matching PT-side overlay (dect_tether_ipv6) uses 1.5 s on its
# PT->FT flow; each side controls its own TX-flow lifetime, the two
# ends do NOT need to match.
#
# Both values are also runtime-tunable via the DECT L2 shell:
#   desh:~$ dect sett --dlc_sdu_lifetime 23
#   desh:~$ dect sett --dlc_discard_release_assoc_count 20
#   desh:~$ dect sett --read    # to verify
#
# Valid sdu_lifetime values: 1..31 (0.5 ms..60 s, see
# enum dect_dlc_sdu_lifetime / nrf_modem_dect_dlc_sdu_lifetime) or 255
# for INFINITY.

CONFIG_DECT_MDM_NRF_DLC_SDU_LIFETIME=23
CONFIG_DECT_MDM_NRF_DLC_DISCARD_TIMER_RELEASE_ASSOC_COUNT=20
