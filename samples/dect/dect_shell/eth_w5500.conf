# Arceli W5500 Ethernet shield on nRF9151 DK.
# Devicetree: Zephyr shield zephyr/boards/shields/arceli_eth_w5500/arceli_eth_w5500.overlay
# plus one of:
#   - w5500-static-mac.overlay — SPI + fixed LA MAC (default, see file header)
#   - w5500.overlay — SPI + zephyr,random-mac-address
#
# Build (static MAC, default):
#   west build -b nrf9151dk/nrf9151/ns <this_sample> -- \
#     -DSHIELD=arceli_eth_w5500 \
#     -DEXTRA_CONF_FILE="eth_common.conf;eth_w5500.conf" \
#     -DDTC_OVERLAY_FILE=w5500-static-mac.overlay
#
# Build (random MAC):
#     ... -DDTC_OVERLAY_FILE=w5500.overlay
#

CONFIG_ETH_W5500=y
# RX alloc wait only (w5500_rx). Keep moderate: the same coop thread also clears
# S0_IR_SENDOK → tx_sem; very large values stall TX-complete vs w5500_tx 10 ms.
CONFIG_ETH_W5500_TIMEOUT=150
CONFIG_ETH_W5500_RX_THREAD_STACK_SIZE=3072
# Use driver default (2): higher coop priority so IRQ/SENDOK is not starved.
#CONFIG_ETH_W5500_RX_THREAD_PRIO=0

# Process IPv6/stack RX on net rx_q[0] instead of inside dect_mdm_rx_th (prj.conf
# NET_TC_RX_COUNT=0). Avoids coupling DECT ingress with same-thread Ethernet TX
# (W5500 tx_sem) under load.
#CONFIG_NET_TC_RX_COUNT=1

#CONFIG_THREAD_NAME=y
#CONFIG_THREAD_ANALYZER=y
#CONFIG_THREAD_ANALYZER_AUTO=y
#CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
#CONFIG_THREAD_ANALYZER_USE_PRINTK=y
#CONFIG_CONSOLE=y
#CONFIG_SERIAL=y
#CONFIG_PRINTK=y
